name: Core CI

on:
  push:
    # Verify the exact commit SHA that was pushed to a protected development ref.
    branches: [main, bootstrap/repository-foundation, 'feature/**']
  # Verify the proposed merge ref, including the current base branch.
  pull_request:
  # Permit an explicit verification when investigating a release or incident.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (CPython 3.11, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked tools
        run: |
          python -m pip install uv==0.13.9
          uv sync --locked --group desktop --python 3.11
      - name: Build and install wheel in isolation
        run: |
          uv build --wheel --no-build-isolation
          uv run --locked python scripts/check_wheel.py
      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Test contracts
        run: uv run --locked --group desktop pytest -ra --junitxml=core-junit.xml
      - name: GIS runtime and integration evidence
        run: |
          uv run --locked --group desktop pytest -ra tests/science --junitxml=science-junit.xml
          uv run --locked --group desktop pytest -ra tests/data --junitxml=data-junit.xml
          uv run --locked --group desktop pytest -ra tests/gis -o junit_logging=all --junitxml=gis-junit.xml
          uv run --locked --group desktop pytest -ra tests/integration --junitxml=integration-junit.xml
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-junit-${{ matrix.os }}
          path: |
            science-junit.xml
            data-junit.xml
            core-junit.xml
            gis-junit.xml
            integration-junit.xml
