[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "lineament-core"
version = "0.1.0"
description = "Core contracts for Lineament Studio"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
gis = ["rasterio==1.4.4", "numpy==2.4.6"]
dev = ["hatchling==1.29.0", "pytest==8.4.2", "ruff==0.15.14"]

[tool.uv]
default-groups = ["dev", "gis"]

[tool.hatch.build.targets.wheel]
packages = ["src/lineament_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py311"
